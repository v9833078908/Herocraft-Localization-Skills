name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skill contract
        run: python3 tools/validate_skills.py

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Dry-run the installer into a scratch project
        run: |
          mkdir -p /tmp/scratch-project
          ./install.sh --project /tmp/scratch-project --dry-run
          ./install.sh --project /tmp/scratch-project
          for skill in skills/*/; do
            name="$(basename "$skill")"
            test -f "/tmp/scratch-project/.agents/skills/$name/SKILL.md"
            test -f "/tmp/scratch-project/.claude/skills/$name/SKILL.md"
          done
          ./install.sh --project /tmp/scratch-project --uninstall
          test ! -e "/tmp/scratch-project/.agents/skills/game-glossary-builder"

      - name: CLAUDE.md must stay a symlink to AGENTS.md
        run: |
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = "AGENTS.md"
